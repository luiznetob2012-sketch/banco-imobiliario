<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102236"><title>Banco Super Imobiliário • Multiplayer</title><style>
:root{color-scheme:dark;font:16px system-ui;color:#f4faf6;background:#0c1625}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#204838,transparent 40%),#0c1625}main{max-width:960px;margin:auto;padding:20px 13px 70px}.card{background:#17293b;border:1px solid #3d586b;border-radius:19px;padding:20px;margin:13px 0}.narrow{max-width:540px;margin:30px auto}h1{font-size:1.7rem}h2{font-size:1.17rem}h1,h2{margin:0 0 14px}p,small{line-height:1.5}small,.muted{color:#b3c6d2}button,input,select,textarea{font:inherit}button{border:1px solid #50758a;background:#29435b;color:white;font-weight:700;min-height:44px;border-radius:11px;padding:10px 13px;cursor:pointer}button.green{background:#8decb8;color:#123027;border-color:#8decb8}button:disabled{opacity:.5}input,select,textarea{width:100%;background:#0c1928;color:white;border:1px solid #557187;border-radius:10px;padding:11px;min-height:44px}textarea{min-height:66px}label{font-weight:650;display:block;margin:12px 0 5px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.player{background:#1e3748;border:1px solid #3a6371;padding:15px;border-radius:13px}.balance{font-size:1.8rem;color:#95ebbc;font-weight:850;margin:10px 0}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.pill{display:inline-block;border:1px solid #65a58b;padding:4px 8px;border-radius:90px;font-size:.75rem;color:#a6f0cb}.notice{position:sticky;top:4px;background:#35526a;color:#fff;padding:12px;border-radius:9px;margin-bottom:10px}.error{background:#74303d}.hidden{display:none}.line{padding:12px 0;border-bottom:1px solid #355164}.line:last-child{border:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}dialog{width:min(95vw,500px);max-height:86vh;overflow:auto;background:#17293b;color:#fff;border:1px solid #50758a;border-radius:18px;padding:20px}dialog::backdrop{background:#000a}hr{border:0;border-top:1px solid #355164;margin:21px 0}@media(max-width:450px){.card{padding:15px}.actions{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><header class="row"><div><small class="pill">🎲 BANCO DIGITAL</small><h1>Banco Super Imobiliário</h1></div><button id="refresh" class="hidden">↻ Atualizar</button></header><div id="notice" class="notice hidden" role="status"></div><div id="app" class="card">Carregando…</div><small>Tabuleiro, dados e ordem de jogo são físicos. O sistema controla apenas o banco.</small></main><dialog id="dlg"><h2 id="dlg-title"></h2><form id="dlg-form"><div id="fields"></div><div class="row" style="margin-top:20px;justify-content:flex-end"><button type="button" id="cancel">Cancelar</button><button class="green" type="submit">Confirmar</button></div></form></dialog>
<script>
'use strict';
// Apenas URL e chave PUBLICA. NUNCA use service_role ou chave secreta.
const PUBLIC={url:'',key:''}, PREFIX='super-bi-online-v1';
const $=s=>document.querySelector(s);
const html=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(n||0));
const stamp=s=>new Date(s).toLocaleString('pt-BR');
let api,room=localStorage.getItem(PREFIX+'room'),info=null,view='acoes',busy=false,handler=null,retry=null,timer;
function message(s,bad=false){const el=$('#notice');el.textContent=s;el.className='notice'+(bad?' error':'');setTimeout(()=>{if(el.textContent===s)el.classList.add('hidden')},6500)}
function config(){try{return PUBLIC.url&&PUBLIC.key?PUBLIC:JSON.parse(localStorage.getItem(PREFIX+'config')||'null')}catch{return null}}
function showConfig(){clearInterval(timer);$('#refresh').classList.add('hidden');$('#app').innerHTML=`<h2>Conectar ao projeto</h2><p class="muted">Informe a URL do Supabase e somente a chave pública publishable ou anon. Nunca use senha, service_role ou secret key.</p><form id="config"><label>Project URL</label><input type="url" name="url" required placeholder="https://projeto.supabase.co"><label>Chave pública</label><input name="key" required autocomplete="off" placeholder="sb_publishable_..."><button class="green" style="margin-top:15px">Conectar</button></form>`}
async function connect(){const c=config();if(!c?.url||!c?.key){showConfig();return}if(!window.supabase?.createClient){showConfig();message('Não foi possível carregar a biblioteca Supabase. Confira sua internet.',true);return}try{api=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data,error}=await api.auth.getSession();if(error)throw error;if(!data.session){const sign=await api.auth.signInAnonymously();if(sign.error)throw sign.error}if(room){const ok=await refresh();if(ok){timer=setInterval(()=>{if(!busy&&!document.hidden&&!$('#dlg').open)refresh()},3500);return}}lobby()}catch(e){showConfig();message(e.message,true)}}
function lobby(){clearInterval(timer);info=null;$('#refresh').classList.add('hidden');$('#app').innerHTML=`<h2>Criar ou entrar em uma sala</h2><p class="muted">De 2 a 6 jogadores, cada um começa com R$ 15.000. Quem cria a sala inicia a partida e o banqueiro é sorteado.</p><form id="create"><label>Seu nome</label><input name="name" required maxlength="40" value="${html(localStorage.getItem(PREFIX+'name')||'')}"><button class="green" style="margin-top:13px">Criar sala</button></form><hr><form id="join"><label>Seu nome</label><input name="name" required maxlength="40" value="${html(localStorage.getItem(PREFIX+'name')||'')}"><label>Código da sala</label><input name="code" required minlength="6" maxlength="6" placeholder="6 caracteres"><button style="margin-top:13px">Entrar na sala</button></form><p class="muted"><small>Use sempre este mesmo navegador. Se limpar os dados do site, sua identidade anônima poderá ser perdida.</small></p>`}
async function call(fn,params){const {data,error}=await api.rpc(fn,params);if(error)throw Error(error.message);return data}
async function refresh(){if(!room)return false;try{info=await call('bi_painel',{p_partida:room});render();return true}catch(e){if(!info){room=null;localStorage.removeItem(PREFIX+'room');lobby()}message('Não foi possível consultar a sala: '+e.message,true);return false}}
async function action(fn){if(busy)return;busy=true;try{const r=await fn();if(r!==false){message('Operação concluída.');await refresh()}}catch(e){message(e.message||String(e),true)}finally{busy=false}}
function people(exclude=false,only=null){return info.jogadores.filter(j=>(!exclude||j.id!==info.meu_jogador_id)&&(!only||only(j))).map(j=>`<option value="${html(j.id)}">${html(j.nome)}</option>`).join('')}
function picker(exclude=false,only=null){return `<label>Jogador</label><select name="target" required>${people(exclude,only)}</select>`}
const amount=()=>'<label>Valor em reais</label><input name="amount" type="number" min="1" max="1000000000" step="1" required>';
const reason=(text,req=true)=>`<label>${html(text)}</label><textarea name="reason" maxlength="140" ${req?'required':''}></textarea>`;
function modal(title,fields,cb){handler=cb;$('#dlg-title').textContent=title;$('#fields').innerHTML=fields;$('#dlg').showModal()}
function close(){$('#dlg').close();handler=null}
function idem(fn,p){const signature=JSON.stringify({fn,...p,p_chave:null});if(retry?.signature!==signature)retry={signature,key:crypto.randomUUID()};p.p_chave=retry.key;return call(fn,p).then(r=>{retry=null;return r})}
function transact(act){const defs={transferir:['Transferir para jogador',picker(true)+amount()+reason('Motivo (opcional)',false)],cobrar:['Cobrar aluguel',picker(true)+amount()+reason('Imóvel (opcional)',false)],pagar_banco:['Pagar ao banco',amount()+reason('Motivo')],hipotecar_tudo:['Hipotecar tudo',amount()+reason('Bens hipotecados')],hipotecar_algumas:['Hipotecar algumas coisas',amount()+reason('Quais bens?')],banco_paga:['Banco paga jogador',picker()+amount()+reason('Bônus ou notícia positiva')],salario:['Salário de passagem',picker()+'<p class="pill">Apenas o jogador escolhido receberá R$ 2.000.</p>']};const [title,fields]=defs[act];modal(title,fields,async f=>{const target=f.get('target')||null,val=act==='salario'?2000:Number(f.get('amount')),motivo=f.get('reason')?.trim()||null;if(!Number.isSafeInteger(val)||val<1||val>1000000000)throw Error('Valor inválido.');const msg=act==='salario'?`Pagar R$ 2.000 a ${nameOf(target)}?`:act==='banco_paga'?`Banco paga ${cash(val)} para ${nameOf(target)}?`:act==='cobrar'?`Solicitar ${cash(val)} de ${nameOf(target)}?`:act==='transferir'?`Transferir ${cash(val)} para ${nameOf(target)}?`:act==='pagar_banco'?`Pagar ${cash(val)} ao banco?`:`Receber ${cash(val)} do banco pela hipoteca?`;if(!window.confirm(msg))return false;return idem('bi_operar',{p_partida:room,p_acao:act,p_alvo:target,p_valor:val,p_motivo:motivo,p_chave:null})})}
function nameOf(id){return info.jogadores.find(j=>j.id===id)?.nome||'jogador'}
function inventory(){return `<p class="muted">Cadastro opcional. Não altera seu saldo.</p><button class="green" data-act="newProperty">+ Cadastrar cidade ou imóvel</button>${(info.meus_imoveis||[]).map(p=>`<div class="line row"><div><strong>${html(p.cidade)} ${p.propriedade?'· '+html(p.propriedade):''}</strong><br><small>${p.casas} casas · ${p.hoteis} hotéis</small></div><div><button data-act="editProperty" data-id="${html(p.id)}">Editar</button> <button data-act="deleteProperty" data-id="${html(p.id)}">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhum imóvel cadastrado.</p>'}`}
function logs(){return `<h2>Últimas transações</h2>${(info.historico||[]).map(t=>`<div class="line"><div class="row"><strong>${cash(t.valor)} · ${html(t.status)}</strong><small>${stamp(t.criada_em)}</small></div>${html(t.de)} → ${html(t.para)}<br><small>${html(t.descricao)}</small></div>`).join('')||'<p class="muted">Nenhuma transação.</p>'}<h2 style="margin-top:25px">Registros de prisão</h2>${(info.eventos||[]).map(e=>`<div class="line"><small>${stamp(e.criada_em)}</small><br>${html(e.descricao)}</div>`).join('')||'<p class="muted">Nenhum registro.</p>'}`}
function render(){const s=info,live=s.status==='jogando',me=s.jogadores.find(j=>j.id===s.meu_jogador_id),bank=s.jogadores.find(j=>j.id===s.banqueiro_id);$('#refresh').classList.remove('hidden');$('#app').innerHTML=`<div class="row"><div><span class="pill">Sala ${html(s.codigo)}</span><h2 style="margin-top:12px">${live?'Partida em andamento':'Esperando jogadores'}</h2><small>${bank?'🏦 Banqueiro: '+html(bank.nome):'O banqueiro será sorteado ao iniciar'}</small></div><div><button data-act="copy">Copiar código</button> <button data-act="leave">Sair da tela</button>${!live&&s.sou_anfitriao?' <button class="green" data-act="start">Iniciar</button>':''}</div></div><hr><h2>Saldos</h2><div class="grid">${s.jogadores.map(j=>`<div class="player"><strong>${html(j.nome)} ${j.id===me.id?'· você':''}</strong>${j.banqueiro?' <span class="pill">Banqueiro</span>':''}<div class="balance">${cash(j.saldo)}</div><small>${j.preso?'🔒 Preso · faltam '+j.jogadas_restantes+' jogadas':''}</small></div>`).join('')}</div>${!live?`<p>Compartilhe o código com o grupo. ${s.jogadores.length} participante(s) nesta sala. A ordem de jogo será decidida manualmente na mesa.</p>`:`<hr><h2>Minha conta: ${cash(me.saldo)}</h2><div class="tabs"><button data-tab="acoes">Operações</button><button data-tab="imoveis">Meus imóveis</button><button data-tab="historico">Histórico</button></div>${view==='acoes'?`<div class="actions"><button data-act="transferir">↗ Transferir para jogador</button><button data-act="cobrar">🧾 Cobrar aluguel</button><button data-act="pagar_banco">🏦 Pagar ao banco</button><button data-act="hipotecar_tudo">🏠 Hipotecar tudo</button><button data-act="hipotecar_algumas">🏘 Hipotecar algumas coisas</button>${me.preso?'<button class="green" data-act="bail">🔓 Pagar fiança R$ 500</button>':''}</div>`:view==='imoveis'?inventory():logs()}${s.cobrancas?.length?`<hr><h2>🔔 Cobranças a responder</h2>${s.cobrancas.map(t=>`<div class="line row"><div><strong>${cash(t.valor)} de ${html(t.de)}</strong><br><small>${html(t.motivo)}</small></div><div><button data-act="reject" data-id="${html(t.id)}">Recusar</button> <button class="green" data-act="accept" data-id="${html(t.id)}">Pagar</button></div></div>`).join('')}`:''}${s.sou_banqueiro?`<hr><span class="pill">Apenas banqueiro</span><h2 style="margin-top:12px">Painel do banco</h2><p class="muted">Seu saldo pessoal é separado do banco.</p><div class="actions"><button class="green" data-act="salario">+ R$ 2.000 · Passagem</button><button data-act="banco_paga">Banco paga jogador</button><button data-act="jail">🔒 Prender por 3 jogadas</button><button data-act="jailStep">⏳ Registrar jogada perdida</button></div>`:''}`}`}
function property(p=null){modal(p?'Editar imóvel':'Registrar imóvel',`<label>Cidade</label><input name="city" maxlength="100" required value="${html(p?.cidade||'')}"><label>Propriedade (opcional)</label><input name="property" maxlength="100" value="${html(p?.propriedade||'')}"><label>Casas</label><input name="houses" type="number" min="0" max="99" value="${p?.casas||0}" required><label>Hotéis</label><input name="hotels" type="number" min="0" max="99" value="${p?.hoteis||0}" required>`,f=>call('bi_salvar_imovel',{p_partida:room,p_registro:p?.id||null,p_cidade:f.get('city').trim(),p_propriedade:f.get('property').trim(),p_casas:Number(f.get('houses')),p_hoteis:Number(f.get('hotels'))}))}
$('#app').addEventListener('click',async e=>{const t=e.target.closest('[data-tab]');if(t){view=t.dataset.tab;render();return}const b=e.target.closest('[data-act]');if(!b||busy)return;const a=b.dataset.act,k=b.dataset.id;if(['transferir','cobrar','pagar_banco','hipotecar_tudo','hipotecar_algumas','banco_paga','salario'].includes(a)){transact(a);return}if(a==='copy'){try{await navigator.clipboard.writeText(info.codigo);message('Código copiado.')}catch{window.prompt('Copie o código:',info.codigo)}return}if(a==='leave'){if(window.confirm('Sair apenas da tela? Você pode voltar pelo código no mesmo navegador.')){room=null;localStorage.removeItem(PREFIX+'room');lobby()}return}if(a==='start'){if(window.confirm('Todos já entraram? Sortear o banqueiro e iniciar?'))action(()=>call('bi_iniciar_partida',{p_partida:room}));return}if(a==='accept'||a==='reject'){if(window.confirm(a==='accept'?'Pagar aluguel?':'Recusar cobrança?'))action(()=>call('bi_responder_aluguel',{p_transacao:k,p_aceitar:a==='accept'}));return}if(a==='bail'){if(window.confirm('Pagar R$ 500 ao banco e sair da prisão?'))action(()=>idem('bi_pagar_fianca',{p_partida:room,p_chave:null}));return}if(a==='newProperty'){property();return}if(a==='editProperty'){property(info.meus_imoveis.find(p=>p.id===k));return}if(a==='deleteProperty'){if(window.confirm('Excluir registro?'))action(()=>call('bi_excluir_imovel',{p_partida:room,p_registro:k}));return}if(a==='jail'||a==='jailStep'){const pool=info.jogadores.filter(j=>a==='jail'?!j.preso:j.preso);if(!pool.length){message('Nenhum jogador disponível.',true);return}modal(a==='jail'?'Prender jogador':'Jogada perdida',`<label>Jogador</label><select name="target">${people(false,j=>a==='jail'?!j.preso:j.preso)}</select><p class="muted">${a==='jail'?'Aplicar prisão por três jogadas.':'Reduzir apenas uma jogada do preso.'}</p>`,f=>{if(!window.confirm('Confirmar alteração da prisão?'))return false;return call('bi_controlar_prisao',{p_partida:room,p_jogador:f.get('target'),p_acao:a==='jail'?'prender':'perder_jogada'})})}});
$('#app').addEventListener('submit',e=>{if(!['config','create','join'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target),which=e.target.id;if(which==='config'){const url=String(f.get('url')).trim().replace(/\/$/,''),key=String(f.get('key')).trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||key.length<20||key.startsWith('sb_secret_')){message('Informe somente a URL válida e chave pública do projeto.',true);return}localStorage.setItem(PREFIX+'config',JSON.stringify({url,key}));connect();return}const name=String(f.get('name')).trim();if(!name||name.length>40){message('Nome inválido.',true);return}action(async()=>{const d=which==='create'?await call('bi_criar_sala',{p_nome:name}):await call('bi_entrar_sala',{p_nome:name,p_codigo:String(f.get('code')).trim().toUpperCase()});room=d.partida_id;localStorage.setItem(PREFIX+'room',room);localStorage.setItem(PREFIX+'name',name);timer=setInterval(()=>{if(!busy&&!document.hidden&&!$('#dlg').open)refresh()},3500);return d})});
$('#dlg-form').addEventListener('submit',e=>{e.preventDefault();if(busy||!handler)return;const cb=handler;action(async()=>{const r=await cb(new FormData(e.target));if(r!==false)close();return r})});$('#cancel').onclick=close;$('#refresh').onclick=()=>refresh();connect();
</script></body></html>
