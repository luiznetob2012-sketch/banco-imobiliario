<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2b"><title>Banco Imobiliário · Multiplayer</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;color:#eff8f4;background:#0c1523;--panel:#18283a;--line:#355067;--muted:#afbecd;--mint:#83e8b0;--red:#ff99a7}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top left,#204339 0,transparent 33%),#0c1523}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #43607a;border-radius:12px;padding:12px 15px;background:#263c52;color:#f7fcff;font-weight:700;min-height:44px}button.primary{background:#8be9b5;border-color:#8be9b5;color:#103023}button.danger{color:#ffbcc6;border-color:#874858;background:#452b3d}button:disabled{opacity:.47;cursor:wait}input,select,textarea{width:100%;background:#101e2e;border:1px solid #4a647a;border-radius:12px;color:white;padding:12px;min-height:44px}textarea{resize:vertical;min-height:70px}label{font-weight:700;font-size:.85rem;display:block;margin:12px 0 6px}small,.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.6rem,5vw,2.2rem)}h2{font-size:1.12rem;margin-bottom:10px}.wrap{max-width:1050px;padding:20px 14px 75px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.head h1{margin:0}.card{background:linear-gradient(135deg,#192b3e,#132132);border:1px solid var(--line);border-radius:20px;padding:19px;margin:12px 0;box-shadow:0 12px 28px #0002}.narrow{max-width:560px;margin:32px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.player{border-radius:17px;padding:15px;background:#1b3041;border:1px solid #35576a}.player.me{border-color:#84e8b0}.money{font-size:clamp(1.45rem,4vw,2rem);font-weight:850;color:var(--mint);margin:9px 0}.chip{display:inline-block;border:1px solid #5e8778;border-radius:999px;padding:4px 8px;font-size:.73rem;color:#a8f1c6}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.actions button{text-align:left;min-height:62px}.muted{line-height:1.5}.warning{background:#443826;border:1px solid #967744;border-radius:12px;padding:12px;color:#ffdc98}.success{background:#183e30;border:1px solid #4d9570;border-radius:12px;padding:12px}.status{position:sticky;top:0;z-index:10;padding:10px;margin-bottom:10px;border-radius:12px;background:#304054;color:#fff}.hidden{display:none!important}.event{padding:12px 0;border-bottom:1px solid #344759;font-size:.9rem}.event:last-child{border:0}.tiny{font-size:.77rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{min-height:38px}.tabs button.selected{border-color:var(--mint);color:var(--mint)}dialog{border:1px solid #53758b;border-radius:22px;background:#16283b;color:#fff;width:min(95vw,520px);padding:20px;max-height:88dvh;overflow:auto}dialog::backdrop{background:#000b}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline button{min-height:36px;padding:8px 10px}.empty{color:var(--muted);text-align:center;padding:24px}.footer{text-align:center;color:#8098aa;font-size:.73rem;margin:34px 0}a{color:var(--mint)}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.wrap{padding-top:13px}.card{padding:15px}.head h1{font-size:1.3rem}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head><body><div class="wrap"><header class="head"><div><div class="chip">🎲 BANCO DIGITAL</div><h1>Banco Super Imobiliário</h1></div><button id="refresh" class="hidden" type="button">↻ Atualizar</button></header><div id="notice" class="status hidden" role="status" aria-live="polite"></div><main id="app"><div class="card narrow">Carregando...</div></main><footer class="footer">Dados, turnos e tabuleiro são físicos · Cada operação financeira é processada pelo banco de dados.</footer></div><dialog id="modal" aria-labelledby="modal-title"><h2 id="modal-title">Operação</h2><form id="operation-form"><div id="modal-fields"></div><div class="modal-actions"><button type="button" id="cancel">Cancelar</button><button id="confirm" class="primary" type="submit">Confirmar</button></div></form></dialog>
<script>
'use strict';
// Quando a URL e a chave publicavel forem fornecidas, poderao ser preenchidas
// aqui para dispensar a configuracao em cada celular. NUNCA usar service_role.
const PUBLIC_CONFIG={url:'',key:''};
const STORAGE='bi-multiplayer-v1';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Number(n||0));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const fmt=s=>{try{return new Date(s).toLocaleString('pt-BR')}catch{return ''}};
const id=()=>crypto.randomUUID();
let client=null,session=null,partida=localStorage.getItem(STORAGE+'-room'),state=null,tab='operacoes',busy=false,modalTask=null,pending=null,poll=null,config=null;
function notice(text,error=false){let el=$('#notice');el.textContent=text;el.style.background=error?'#632f3a':'#304054';el.classList.remove('hidden');setTimeout(()=>{if(el.textContent===text)el.classList.add('hidden')},7500)}
function setBusy(v){busy=v;document.querySelectorAll('button').forEach(b=>{if(b.id!=='cancel')b.disabled=v});}
function cfg(){try{let saved=JSON.parse(localStorage.getItem(STORAGE+'-config')||'null');return PUBLIC_CONFIG.url&&PUBLIC_CONFIG.key?PUBLIC_CONFIG:saved}catch{return null}}
function validateConfig(url,key){try{let u=new URL(url);return u.protocol==='https:'&&u.hostname.endsWith('.supabase.co')&&key.length>20}catch{return false}}
function screenConfig(){clearInterval(poll);$('#refresh').classList.add('hidden');$('#app').innerHTML=`<section class="card narrow"><h2>Conectar ao Supabase</h2><p class="muted">É preciso informar a URL do projeto e a chave pública publishable ou anon. Depois poderemos colocá-las no site para não repetir isto em cada celular. <strong>Nunca informe senha, service_role ou secret key.</strong></p><form id="config-form"><label>URL do projeto</label><input name="url" type="url" placeholder="https://seu-projeto.supabase.co" required autocomplete="off" value="${esc(config?.url||'')}"><label>Chave pública publishable / anon</label><input name="key" type="text" required autocomplete="off" placeholder="sb_publishable_... ou chave anon" value="${esc(config?.key||'')}"><p><button class="primary" type="submit">Conectar</button></p></form></section>`}
async function connect(){config=cfg();if(!config||!validateConfig(config.url,config.key)){screenConfig();return}if(!window.supabase?.createClient){$('#app').innerHTML='<div class="card warning">Biblioteca de conexão não carregou. Verifique a internet e atualize.</div>';return}try{client=window.supabase.createClient(config.url,config.key,{auth:{persistSession:true,autoRefreshToken:true}});let result=await client.auth.getSession();if(result.error)throw result.error;session=result.data.session;if(!session){let sign=await client.auth.signInAnonymously();if(sign.error)throw sign.error;session=sign.data.session}if(!session)throw Error('Falha ao iniciar sessão.');if(partida){await refresh();if(state){startPoll();return}}screenLobby()}catch(e){screenConfig();notice('Falha de conexão: '+(e.message||e),true)}}
function screenLobby(){clearInterval(poll);state=null;$('#refresh').classList.add('hidden');$('#app').innerHTML=`<section class="card narrow"><h2>Começar a jogar</h2><p class="muted">Cada pessoa entra no próprio celular. Até seis jogadores, R$ 15.000 por jogador. Os dados são jogados na mesa.</p><form id="create-form"><label>Seu nome</label><input name="name" maxlength="40" required placeholder="Como quer aparecer?" value="${esc(localStorage.getItem(STORAGE+'-name')||'')}"><button class="primary" style="margin-top:12px;width:100%">Criar sala</button></form><hr style="border-color:#355067;margin:24px 0"><form id="join-form"><label>Seu nome</label><input name="name" maxlength="40" required placeholder="Seu nome" value="${esc(localStorage.getItem(STORAGE+'-name')||'')}"><label>Código enviado pelo anfitrião</label><input name="code" maxlength="6" minlength="6" required placeholder="Ex.: A7F3D2" style="text-transform:uppercase"><button style="margin-top:12px;width:100%">Entrar na sala</button></form><p class="tiny muted" style="margin-top:18px">Sessão anônima vinculada a este navegador. Se apagar os dados do navegador ou entrar em modo privado, poderá perder o acesso ao seu jogador.</p></section>`}
async function rpc(name,params){if(!client)throw Error('Não conectado.');let r=await client.rpc(name,params);if(r.error)throw Error(r.error.message);return r.data}
async function run(task){if(busy)return;setBusy(true);try{let result=await task();notice('Operação realizada.');await refresh();return result}catch(e){notice(e.message||String(e),true);return null}finally{setBusy(false)}}
async function refresh(){if(!partida||!client)return;try{let result=await rpc('bi_painel',{p_partida:partida});state=result;draw();return result}catch(e){if(!state){partida=null;localStorage.removeItem(STORAGE+'-room');screenLobby()}notice('Não foi possível atualizar: '+e.message,true);return null}}
function startPoll(){clearInterval(poll);poll=setInterval(()=>{if(!busy&&!document.hidden&&!$('#modal').open)refresh()},3500)}
function playerName(pid){return state?.jogadores?.find(x=>x.id===pid)?.nome||'Jogador'}
function options(list,excludeMe=false){return (list||[]).filter(x=>!excludeMe||x.id!==state.meu_jogador_id).map(x=>`<option value="${esc(x.id)}">${esc(x.nome)}${x.banqueiro?' 🏦':''}</option>`).join('')}
function draw(){if(!state)return;$('#refresh').classList.remove('hidden');let s=state,me=s.jogadores.find(j=>j.id===s.meu_jogador_id),bank=s.jogadores.find(j=>j.id===s.banqueiro_id);let playing=s.status==='jogando';$('#app').innerHTML=`<section class="card"><div class="row"><div><span class="chip">Sala ${esc(s.codigo)}</span><h2 style="margin:12px 0 3px">${playing?'Partida em andamento':'Aguardando jogadores'}</h2><span class="muted">${bank?'🏦 Banqueiro: '+esc(bank.nome):'O banqueiro será sorteado ao iniciar'}</span></div><div class="inline"><button type="button" data-act="copy">Copiar código</button><button type="button" data-act="leave">Sair da tela</button>${!playing&&s.sou_anfitriao?'<button class="primary" type="button" data-act="start">Iniciar partida</button>':''}</div></div></section><section><h2>Saldos dos jogadores</h2><div class="players">${s.jogadores.map(j=>`<div class="player ${j.id===s.meu_jogador_id?'me':''}"><div class="row"><strong>${esc(j.nome)} ${j.id===s.meu_jogador_id?'· você':''}</strong>${j.banqueiro?'<span class="chip">🏦 Banqueiro</span>':''}</div><div class="money">${money(j.saldo)}</div>${j.preso?`<span class="chip">🔒 Preso · ${j.jogadas_restantes} jogadas</span>`:'<span class="tiny muted">Conta ativa</span>'}</div>`).join('')}</div></section>${!playing?`<section class="card"><h2>Como começar?</h2><p class="muted">Compartilhe o código <strong>${esc(s.codigo)}</strong> com os outros. Quando todos entrarem, o anfitrião inicia a partida e o sistema sorteia o banqueiro. A ordem dos dados é decidida manualmente.</p><strong>${s.jogadores.length} / ${s.max_jogadores||6} jogadores</strong></section>`:`<section class="card"><h2>Minha conta ${me?.preso?'<span class="chip">🔒 Preso</span>':''}</h2><div class="money">${money(me?.saldo)}</div><div class="tabs"><button data-tab="operacoes" class="${tab==='operacoes'?'selected':''}">Operações</button><button data-tab="imoveis" class="${tab==='imoveis'?'selected':''}">Meus imóveis</button><button data-tab="historico" class="${tab==='historico'?'selected':''}">Histórico</button></div>${tab==='operacoes'?operations():tab==='imoveis'?inventory():history()}</section>`}${playing&&s.cobrancas?.length?`<section class="card"><h2>🔔 Cobranças aguardando sua resposta</h2>${s.cobrancas.map(c=>`<div class="event"><div class="row"><div><strong>${money(c.valor)}</strong> · ${esc(c.de)}<br><small>${esc(c.motivo)}</small></div><div class="inline"><button data-act="reject" data-id="${esc(c.id)}">Recusar</button><button class="primary" data-act="accept" data-id="${esc(c.id)}">Pagar</button></div></div></div>`).join('')}</section>`:''}${playing&&s.sou_banqueiro?bankPanel():''}`}
function operations(){let me=state.jogadores.find(j=>j.id===state.meu_jogador_id);return `<div class="actions"><button data-act="transfer">↗ Transferir para jogador</button><button data-act="charge">🧾 Cobrar aluguel</button><button data-act="paybank">🏦 Pagar ao banco</button><button data-act="mortgageAll">🏠 Hipotecar tudo</button><button data-act="mortgageSome">🏘 Hipotecar algumas coisas</button>${me?.preso?'<button class="primary" data-act="bail">🔓 Pagar fiança · R$ 500</button>':''}</div><p class="muted tiny" style="margin-top:16px">Aluguel depende da confirmação de quem vai pagar. Hipoteca recebe o valor informado por você, sem avaliação automática dos bens.</p>`}
function inventory(){let rows=state.meus_imoveis||[];return `<p class="muted">Opcional: registre suas cidades, casas e hotéis. Este cadastro não altera dinheiro nem comprova titularidade.</p><button class="primary" data-act="propertyNew">+ Adicionar propriedade</button>${rows.length?rows.map(r=>`<div class="event"><div class="row"><div><strong>${esc(r.cidade)}</strong> ${r.propriedade?'· '+esc(r.propriedade):''}<br><small>🏠 ${r.casas} casas · 🏨 ${r.hoteis} hotéis</small></div><div class="inline"><button data-act="propertyEdit" data-id="${esc(r.id)}">Editar</button><button class="danger" data-act="propertyDelete" data-id="${esc(r.id)}">Excluir</button></div></div></div>`).join(''):'<div class="empty">Nenhum imóvel registrado.</div>'}`}
function history(){let rows=state.historico||[],ev=state.eventos||[];return `<h3>Movimentações</h3>${rows.length?rows.map(r=>`<div class="event"><div class="row"><strong>${money(r.valor)} · ${esc(r.status)}</strong><small>${fmt(r.criada_em)}</small></div><div>${esc(r.de)} → ${esc(r.para)}</div><small>${esc(r.descricao)}</small></div>`).join(''):'<div class="empty">Nenhuma transação ainda.</div>'}<h3 style="margin-top:22px">Prisão</h3>${ev.length?ev.map(e=>`<div class="event"><small>${fmt(e.criada_em)}</small><br>${esc(e.descricao)}</div>`).join(''):'<p class="muted">Nenhum evento de prisão.</p>'}`}
function bankPanel(){return `<section class="card"><span class="chip">Acesso exclusivo do banqueiro</span><h2 style="margin-top:13px">🏦 Painel do banco</h2><p class="muted">Você também pode usar todas as operações de sua conta pessoal acima. Os pagamentos do banco não saem do seu saldo.</p><div class="actions"><button class="primary" data-act="salary">+ R$ 2.000 · passagem</button><button data-act="bankpay">💵 Banco paga jogador</button><button data-act="jail">🔒 Prender jogador</button><button data-act="jailtick">⏳ Registrar jogada perdida</button></div></section>`}
function field(label,body){return `<label>${label}</label>${body}`}
function playerSelect(exclude=false){return field('Jogador',`<select name="target" required>${options(state.jogadores,exclude)}</select>`)}
function amount(value=''){return field('Valor em reais',`<input name="amount" type="number" min="1" max="1000000000" step="1" required value="${esc(value)}" placeholder="Ex.: 2500">`)}
function desc(placeholder='Motivo / descrição',required=true){return field(placeholder,`<textarea name="reason" maxlength="140" ${required?'required':''} placeholder="${esc(placeholder)}"></textarea>`)}
function openModal(title,fields,task,button='Confirmar'){modalTask=task;$('#modal-title').textContent=title;$('#modal-fields').innerHTML=fields;$('#confirm').textContent=button;$('#modal').showModal()}
function closeModal(){$('#modal').close();modalTask=null}
function operation(acao){let defs={transfer:['Transferir para outro jogador',playerSelect(true)+amount()+desc('Motivo (opcional)',false)],charge:['Cobrar aluguel',playerSelect(true)+amount()+desc('Imóvel ou motivo',false)],paybank:['Pagar ao banco',amount()+desc('Motivo do pagamento')],mortgageAll:['Hipotecar tudo',amount()+desc('Bens hipotecados / observação')],mortgageSome:['Hipotecar algumas coisas',amount()+desc('Quais bens foram hipotecados?')],bankpay:['Banco paga jogador',playerSelect()+amount()+desc('Bônus ou notícia positiva')],salary:['Salário de passagem · R$ 2.000',playerSelect()+'<p class="success">Somente o jogador selecionado receberá R$ 2.000.</p>']};let def=defs[acao];let api={transfer:'transferir',charge:'cobrar',paybank:'pagar_banco',mortgageAll:'hipotecar_tudo',mortgageSome:'hipotecar_algumas',bankpay:'banco_paga',salary:'salario'}[acao];openModal(def[0],def[1],async fd=>{let alvo=fd.get('target')||null;let valor=acao==='salary'?2000:Number(fd.get('amount'));let motivo=fd.get('reason')?.trim()||null;if(acao!=='salary'&&(!Number.isSafeInteger(valor)||valor<1||valor>1000000000))throw Error('Informe um valor inteiro positivo.');let msg=acao==='charge'?`Solicitar cobrança de ${money(valor)} a ${playerName(alvo)}?`:acao==='salary'?`Creditar R$ 2.000 somente para ${playerName(alvo)}?`:acao==='transfer'?`Enviar ${money(valor)} do SEU saldo para ${playerName(alvo)}?`:acao==='bankpay'?`Banco pagará ${money(valor)} a ${playerName(alvo)}?`:acao==='paybank'?`Pagar ${money(valor)} do seu saldo ao banco?`:`Receber ${money(valor)} do banco por hipoteca?`;if(!confirm(msg))return false;let params={p_partida:partida,p_acao:api,p_alvo:alvo,p_valor:valor,p_motivo:motivo,p_chave:null};return executeWithKey('bi_operar',params)})}
async function executeWithKey(fn,params){let signature=JSON.stringify({fn,...params,p_chave:null});if(!pending||pending.signature!==signature)pending={signature,key:id()};params.p_chave=pending.key;let result=await rpc(fn,params);pending=null;return result}
function propertyModal(existing=null){openModal(existing?'Editar imóvel':'Adicionar imóvel',field('Cidade',`<input name="city" maxlength="100" required value="${esc(existing?.cidade||'')}">`)+field('Propriedade (opcional)',`<input name="property" maxlength="100" value="${esc(existing?.propriedade||'')}">`)+field('Quantidade de casas',`<input name="houses" type="number" min="0" max="99" required value="${Number(existing?.casas||0)}">`)+field('Quantidade de hotéis',`<input name="hotels" type="number" min="0" max="99" required value="${Number(existing?.hoteis||0)}">`),async fd=>{let city=fd.get('city').trim(),houses=Number(fd.get('houses')),hotels=Number(fd.get('hotels'));if(!city||!Number.isInteger(houses)||!Number.isInteger(hotels)||houses<0||hotels<0||houses>99||hotels>99)throw Error('Verifique cidade e quantidades.');return rpc('bi_salvar_imovel',{p_partida:partida,p_registro:existing?.id||null,p_cidade:city,p_propriedade:fd.get('property').trim(),p_casas:houses,p_hoteis:hotels})},'Salvar')}
async function clickAction(act,node){if(!state||busy)return;let item=node.dataset.id;if(['transfer','charge','paybank','mortgageAll','mortgageSome','bankpay','salary'].includes(act)){operation(act);return}if(act==='copy'){try{await navigator.clipboard.writeText(state.codigo);notice('Código copiado!')}catch{prompt('Copie o código:',state.codigo)}return}if(act==='leave'){if(confirm('Sair somente desta tela? Você poderá voltar usando o mesmo código e navegador.')){partida=null;localStorage.removeItem(STORAGE+'-room');screenLobby()}return}if(act==='start'){if(confirm('Todos já entraram? O banqueiro será sorteado agora.'))await run(()=>rpc('bi_iniciar_partida',{p_partida:partida}));return}if(act==='accept'||act==='reject'){let yes=act==='accept';if(confirm(yes?'Confirmar pagamento deste aluguel?':'Recusar esta cobrança?'))await run(()=>rpc('bi_responder_aluguel',{p_transacao:item,p_aceitar:yes}));return}if(act==='bail'){if(confirm('Pagar R$ 500 ao banco e sair imediatamente da prisão?'))await run(()=>executeWithKey('bi_pagar_fianca',{p_partida:partida,p_chave:null}));return}if(act==='jail'||act==='jailtick'){let list=act==='jail'?state.jogadores.filter(j=>!j.preso):state.jogadores.filter(j=>j.preso);if(!list.length){notice('Nenhum jogador disponível para esta ação.',true);return}openModal(act==='jail'?'Prender por 3 jogadas':'Registrar jogada perdida',field('Jogador',`<select name="target">${options(list)}</select>`)+`<p class="warning">${act==='jail'?'O jogador ficará preso por três jogadas.':'Registre somente quando o jogador preso realmente perder sua própria jogada.'}</p>`,async fd=>{let target=fd.get('target');if(!confirm(act==='jail'?`Prender ${playerName(target)} por 3 jogadas?`:`Descontar uma jogada de prisão de ${playerName(target)}?`))return false;return rpc('bi_controlar_prisao',{p_partida:partida,p_jogador:target,p_acao:act==='jail'?'prender':'perder_jogada'})});return}if(act==='propertyNew'){propertyModal();return}if(act==='propertyEdit'){propertyModal(state.meus_imoveis.find(p=>p.id===item));return}if(act==='propertyDelete'){if(confirm('Excluir este registro de imóvel?'))await run(()=>rpc('bi_excluir_imovel',{p_partida:partida,p_registro:item}));return}}
$('#app').addEventListener('click',e=>{let tabButton=e.target.closest('[data-tab]');if(tabButton){tab=tabButton.dataset.tab;draw();return}let b=e.target.closest('[data-act]');if(b)clickAction(b.dataset.act,b)});
$('#app').addEventListener('submit',async e=>{if(!['config-form','create-form','join-form'].includes(e.target.id))return;e.preventDefault();let f=new FormData(e.target);if(e.target.id==='config-form'){let url=String(f.get('url')).trim().replace(/\/$/,'');let key=String(f.get('key')).trim();if(!validateConfig(url,key)){notice('Verifique URL Supabase e chave pública. Não use chave secreta.',true);return}localStorage.setItem(STORAGE+'-config',JSON.stringify({url,key}));config={url,key};await connect();return}let name=String(f.get('name')).trim();if(!name||name.length>40){notice('Informe um nome de até 40 caracteres.',true);return}await run(async()=>{let d=e.target.id==='create-form'?await rpc('bi_criar_sala',{p_nome:name}):await rpc('bi_entrar_sala',{p_codigo:String(f.get('code')).trim().toUpperCase(),p_nome:name});localStorage.setItem(STORAGE+'-name',name);partida=d.partida_id;localStorage.setItem(STORAGE+'-room',partida);await refresh();startPoll()})});
$('#refresh').onclick=()=>refresh();$('#cancel').onclick=()=>closeModal();$('#operation-form').addEventListener('submit',async e=>{e.preventDefault();if(!modalTask||busy)return;let fn=modalTask;setBusy(true);try{let result=await fn(new FormData(e.target));if(result===false)return;closeModal();notice('Operação realizada.');await refresh()}catch(err){notice(err.message||String(err),true)}finally{setBusy(false)}});
connect();
</script></body></html>
